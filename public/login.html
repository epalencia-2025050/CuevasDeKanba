<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión · K’anba Cuevas Vivas</title>
  <meta name="description" content="Acceso para visitantes y administración de K’anba Cuevas Vivas.">
  <meta name="theme-color" content="#f3ede1">
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..600&family=Manrope:wght@300..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body class="login-page">
  <main class="login-screen" id="loginScreen">
    <form class="login-card" id="loginForm" novalidate>
      <div class="login-topbar">
        <button type="button" class="login-back" id="backButton" aria-label="Regresar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Regresar
        </button>
        <a class="login-home" href="index.html">Inicio</a>
      </div>

      <a class="brand login-brand" href="index.html" aria-label="K’anba, inicio">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 40 40"><path d="M5 35V20a15 15 0 0 1 30 0v15" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M20 31c-4.7-3.6-7-6.8-7-10.4a7 7 0 0 1 14 0c0 3.6-2.3 6.8-7 10.4Z" fill="currentColor"/><path d="M19 25.8c.1-2.9.8-4.7 1.8-6.3.6 2 1.9 3 2.4 5 .3 1.2-.4 2.5-2 2.8-1.6.3-2.3-.7-2.2-1.5Z" fill="#0e2420"/></svg>
        </span>
        <span class="brand-type"><strong>K’anba</strong><small>Cuevas Vivas</small></span>
      </a>

      <div class="login-tabs" role="tablist" aria-label="Tipo de acceso">
        <button type="button" class="login-tab is-active" data-role="user" role="tab" aria-selected="true">Usuario</button>
        <button type="button" class="login-tab" data-role="admin" role="tab" aria-selected="false">Administrador</button>
      </div>

      <div class="login-panels">
        <section class="login-panel is-active" id="panel-user">
          <h1>Iniciar sesión</h1>
          <p class="login-lead">Entra con tu cuenta para poder reservar tu tour.</p>
          <label class="field">
            <span>Correo electrónico</span>
            <input type="email" id="userEmail" autocomplete="email" placeholder="tucorreo@ejemplo.com">
          </label>
          <label class="field">
            <span>Contraseña</span>
            <input type="password" id="userPassword" autocomplete="current-password" placeholder="Tu contraseña">
          </label>
          <div class="form-error" id="userError" role="alert" hidden></div>
          <button class="btn btn-primary login-submit" type="submit" id="userSubmit">Entrar</button>
          <p class="login-note">¿No tienes cuenta? <button type="button" class="link-inline" id="goRegister">Crear una cuenta</button></p>
        </section>

        <section class="login-panel" id="panel-register">
          <h1>Crear cuenta</h1>
          <p class="login-lead">Regístrate rápido para continuar con tu reserva.</p>
          <label class="field">
            <span>Nombre completo</span>
            <input type="text" id="regName" autocomplete="name" placeholder="Tu nombre">
          </label>
          <label class="field">
            <span>Correo electrónico</span>
            <input type="email" id="regEmail" autocomplete="email" placeholder="tucorreo@ejemplo.com">
          </label>
          <label class="field">
            <span>Contraseña</span>
            <input type="password" id="regPassword" autocomplete="new-password" placeholder="Mínimo 6 caracteres">
          </label>
          <div class="form-error" id="regError" role="alert" hidden></div>
          <button class="btn btn-primary login-submit" type="submit" id="regSubmit">Crear cuenta y entrar</button>
          <p class="login-note">¿Ya tienes cuenta? <button type="button" class="link-inline" id="goLogin">Iniciar sesión</button></p>
        </section>

        <section class="login-panel" id="panel-admin">
          <h1>Acceso administrador</h1>
          <p class="login-lead">Panel para gestionar reservas y contenido.</p>
          <label class="field">
            <span>Contraseña</span>
            <input type="password" id="adminPassword" autocomplete="current-password" placeholder="Contraseña de administrador">
          </label>
          <div class="form-error" id="adminError" role="alert" hidden></div>
          <button class="btn btn-dark login-submit" type="submit" id="adminSubmit">Entrar al panel</button>
        </section>
      </div>

      <input type="hidden" id="nextUrl" value="">
    </form>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="js/login.js" defer></script>
  <script src="js/file-notice.js"></script>
</body>
</html>
