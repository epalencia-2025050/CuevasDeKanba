name = "cuevasdekanba"
main = "server/worker.js"
compatibility_date = "2026-11-18"
compatibility_flags = ["nodejs_compat"]

# Servir archivos estáticos del sitio (public/) mediante el binding ASSETS
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
not_found_handling = "none"

# Variables de entorno para producción
[vars]
NODE_ENV = "production"
PUBLIC_URL = "https://cuevasdekanba.paserne13.workers.dev"
DB_SCHEMA = "kanba_rel"

# Mantenimiento periódico programado
[triggers]
crons = ["* * * * *"]

# Integración con Neon (PostgreSQL):
# Cloudflare Workers se conecta de forma segura a Neon mediante sockets TCP nativos (`nodejs_compat`).
# La variable confidencial DATABASE_URL se suministra como secreto en Cloudflare Workers:
#   npx wrangler secret put DATABASE_URL
#
# Opcional (aceleración Hyperdrive):
# [[hyperdrive]]
# binding = "HYPERDRIVE"
# id = "TU_HYPERDRIVE_ID"
